name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

env:
  # Pinned so a validator release cannot change the gate under us.
  PLUGIN_VALIDATOR_VERSION: '0.45.6'

jobs:
  release:
    permissions:
      contents: write
      # Both are required to publish a build provenance attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test backend
        uses: magefile/mage-action@v3
        with:
          version: latest
          args: coverage

      - name: Build backend
        uses: magefile/mage-action@v3
        with:
          version: latest
          args: buildAll

      - name: Sign plugin
        run: npm run sign

      - name: Get plugin metadata
        id: metadata
        run: |
          sudo apt-get install -y jq
          export GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          export GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          export GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip

          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> $GITHUB_OUTPUT

      - name: Package plugin
        run: |
          mv dist ${{ steps.metadata.outputs.plugin-id }}
          zip ${{ steps.metadata.outputs.archive }} ${{ steps.metadata.outputs.plugin-id }} -r
          sha1sum ${{ steps.metadata.outputs.archive }} | cut -f1 -d' ' > ${{ steps.metadata.outputs.archive }}.sha1

      # The Grafana submission runs this same validator. Running it here means a
      # rejection shows up in CI instead of days later in the review queue.
      # It fails the job on any error, warnings do not fail it.
      - name: Validate plugin
        run: |
          BASE="https://github.com/grafana/plugin-validator/releases/download"
          curl -sSL "${BASE}/plugin-validator%2Fv${PLUGIN_VALIDATOR_VERSION}/plugin-validator_${PLUGIN_VALIDATOR_VERSION}_linux_amd64.tar.gz" \
            | tar xz plugincheck2
          ./plugincheck2 \
            -sourceCodeUri "file://${GITHUB_WORKSPACE}" \
            "${{ steps.metadata.outputs.archive }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ./${{ steps.metadata.outputs.archive }}

      - name: Create Github release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./${{ steps.metadata.outputs.archive }}
            ./${{ steps.metadata.outputs.archive }}.sha1

      # Grafana has no API to submit a plugin. A human fills the form at
      # https://grafana.com/orgs/ovhcloud/plugins -> Submit Update.
      # This step prints exactly what that form asks for.
      - name: Print the plugin submission form values
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="${{ steps.metadata.outputs.archive }}"
          BASE="https://github.com/${GITHUB_REPOSITORY}"

          {
            echo "## Grafana plugin submission"
            echo
            echo "Publish the draft release first. The URLs below 404 while it stays a draft."
            echo
            echo "Then go to <https://grafana.com/orgs/ovhcloud/plugins> -> **${{ steps.metadata.outputs.plugin-id }}** -> **Submit Update**."
            echo
            echo "| Form field | Value |"
            echo "| --- | --- |"
            echo "| OS & Architecture | Single (the archive carries every platform binary) |"
            echo "| URL | \`${BASE}/releases/download/${TAG}/${ARCHIVE}\` |"
            echo "| Source code URL | \`${BASE}/tree/${TAG}\` |"
            echo "| SHA1 | \`$(cat "${ARCHIVE}.sha1")\` |"
            echo "| Provisioning configured | Yes (\`provisioning/\`) |"
          } >> "$GITHUB_STEP_SUMMARY"
