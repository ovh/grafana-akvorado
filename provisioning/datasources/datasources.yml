apiVersion: 1

datasources:
  # Points at the public Akvorado demo so a fresh Grafana, and a plugin
  # reviewer, get a data source that answers straight away.
  - name: 'akvorado'
    type: 'ovhcloud-akvorado-datasource'
    access: proxy
    url: 'https://demo.akvorado.net'
    isDefault: false
    orgId: 1
    version: 1
    editable: true
